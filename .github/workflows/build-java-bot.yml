name: Build bundled Java bot.jar

on:
  push:
    branches:
      - main
    paths:
      - 'bundled/java/**'
      - '!bundled/java/bot.jar'
      - '.github/workflows/build-java-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build executable JAR
        working-directory: bundled/java
        run: mvn -B -DskipTests clean package

      - name: Validate executable JAR
        run: |
          test -f bundled/java/target/bot.jar
          unzip -p bundled/java/target/bot.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: pro.maszynka.Bot'

      - name: Store bot.jar in bundled/java
        run: cp bundled/java/target/bot.jar bundled/java/bot.jar

      - name: Commit built bot.jar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundled/java/bot.jar
          if git diff --cached --quiet; then
            echo 'bot.jar is already up to date'
            exit 0
          fi
          git commit -m 'Build bundled Java bot.jar'
          git push
