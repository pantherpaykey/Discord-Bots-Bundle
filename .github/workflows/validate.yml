name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm run validate:eggs
      - run: bash -n scripts/build-release.sh
      - run: npm install && node --check index.js
        working-directory: bundled/nodejs
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt && python -m py_compile main.py
        working-directory: bundled/python
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -q -DskipTests package
        working-directory: bundled/java
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build
        working-directory: bundled/dotnet
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x' }
      - run: go build ./...
        working-directory: bundled/go
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: bundled/rust
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: composer validate --no-check-publish && composer install --no-interaction && php -l index.php
        working-directory: bundled/php
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check main.ts
        working-directory: bundled/deno
      - uses: oven-sh/setup-bun@v2
      - run: bun install && bun --syntax-only index.ts
        working-directory: bundled/bun
